<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4ec0ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Bird">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    inset: 0;
    background: #1c1c1c;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: pointer; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 1px; height: env(safe-area-inset-top); visibility: hidden; pointer-events: none; }
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="game" aria-label="Flappy Bird"></canvas>

<script>
(() => {
  'use strict';

  // ================= Constantes (unidades por "tick" de 1/60 s) =================
  // Física calibrada pelos clones de referência (nebez/floppybird e sourabhv/FlapPyBird)
  const W = 288;
  const GROUND_H = 112;
  const GRAVITY = 0.25, FLAP = -4.6, MAX_FALL = 8;
  const CRASH_GRAVITY = 0.5, CRASH_MAX = 7.5;
  const SPEED = 2;
  const PIPE_W = 52, BODY_W = 48, CAP_H = 24, GAP = 100, SPACING = 150;
  const BIRD_X = 76, BIRD_R = 10;
  const STEP = 1000 / 60;

  // Altura lógica acompanha o formato da tela (512 a 640) para preencher o iPhone
  let H = 512, GROUND_Y = H - GROUND_H, safeTop = 0;

  const K = '#543847';
  const PIPE = { light: '#9ce659', hi: '#e4fe89', mid: '#73bf2e', dark: '#558022' };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignora */ } }
  };

  // ================= Utilidades de pixel art =================
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function disc(g, cx, cy, r, color) {
    g.fillStyle = color;
    for (let dy = -r; dy <= r; dy++) {
      const dx = Math.floor(Math.sqrt(r * r - dy * dy + 0.25));
      g.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
    }
  }

  // Grade de caracteres -> sprite colorido (cada caractere = 1 pixel; '.' = transparente)
  function paletteSprite(rows, pal) {
    const c = mk(rows[0].length, rows.length), g = c.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const col = pal[row[x]];
        if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
      }
    });
    return c;
  }

  // ================= Fonte bitmap 5x7 (letras, números e acentos) =================
  const FONT_SRC = {
    ' ': '00000,00000,00000,00000,00000,00000,00000',
    'A': '01110,10001,10001,11111,10001,10001,10001',
    'B': '11110,10001,10001,11110,10001,10001,11110',
    'C': '01110,10001,10000,10000,10000,10001,01110',
    'D': '11110,10001,10001,10001,10001,10001,11110',
    'E': '11111,10000,10000,11110,10000,10000,11111',
    'F': '11111,10000,10000,11110,10000,10000,10000',
    'G': '01110,10001,10000,10111,10001,10001,01111',
    'H': '10001,10001,10001,11111,10001,10001,10001',
    'I': '01110,00100,00100,00100,00100,00100,01110',
    'J': '00111,00010,00010,00010,00010,10010,01100',
    'K': '10001,10010,10100,11000,10100,10010,10001',
    'L': '10000,10000,10000,10000,10000,10000,11111',
    'M': '10001,11011,10101,10101,10001,10001,10001',
    'N': '10001,11001,10101,10011,10001,10001,10001',
    'O': '01110,10001,10001,10001,10001,10001,01110',
    'P': '11110,10001,10001,11110,10000,10000,10000',
    'Q': '01110,10001,10001,10001,10101,10010,01101',
    'R': '11110,10001,10001,11110,10100,10010,10001',
    'S': '01111,10000,10000,01110,00001,00001,11110',
    'T': '11111,00100,00100,00100,00100,00100,00100',
    'U': '10001,10001,10001,10001,10001,10001,01110',
    'V': '10001,10001,10001,10001,10001,01010,00100',
    'W': '10001,10001,10001,10101,10101,11011,10001',
    'X': '10001,10001,01010,00100,01010,10001,10001',
    'Y': '10001,10001,01010,00100,00100,00100,00100',
    'Z': '11111,00001,00010,00100,01000,10000,11111',
    '0': '01110,10001,10011,10101,11001,10001,01110',
    '1': '00100,01100,00100,00100,00100,00100,01110',
    '2': '01110,10001,00001,00010,00100,01000,11111',
    '3': '11110,00001,00001,01110,00001,00001,11110',
    '4': '00010,00110,01010,10010,11111,00010,00010',
    '5': '11111,10000,11110,00001,00001,10001,01110',
    '6': '00110,01000,10000,11110,10001,10001,01110',
    '7': '11111,00001,00010,00100,01000,01000,01000',
    '8': '01110,10001,10001,01110,10001,10001,01110',
    '9': '01110,10001,10001,01111,00001,00010,01100',
    '!': '00100,00100,00100,00100,00100,00000,00100',
    '.': '00000,00000,00000,00000,00000,00110,00110',
    ',': '00000,00000,00000,00000,00110,00100,01000',
    '-': '00000,00000,00000,11111,00000,00000,00000',
    ':': '00000,00110,00110,00000,00110,00110,00000',
    '=': '00000,00000,11111,00000,11111,00000,00000',
    '/': '00001,00010,00010,00100,01000,01000,10000'
  };
  const FONT = {};
  for (const k in FONT_SRC) FONT[k] = FONT_SRC[k].split(',');

  // marcas de acento: [coluna, linha] no bloco acima da letra (linhas 0-1)
  const MARKS_TOP = {
    '́': [[3, 0], [2, 1]],
    '̀': [[1, 0], [2, 1]],
    '̂': [[2, 0], [1, 1], [3, 1]],
    '̃': [[1, 1], [2, 0], [3, 0], [4, 1]]
  };

  // Grade booleana -> sprite com contorno escuro (estilo dos números do original)
  function gridSprite(rows, u, fill) {
    const o = Math.max(1, Math.round(u / 2));
    const gh = rows.length, gw = rows[0].length;
    const c = mk(gw * u + 2 * o, gh * u + 2 * o), g = c.getContext('2d');
    g.fillStyle = K;
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++)
      if (rows[y][x] === '1' || rows[y][x] === '#') g.fillRect(x * u, y * u, u + 2 * o, u + 2 * o);
    g.fillStyle = fill;
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++)
      if (rows[y][x] === '1' || rows[y][x] === '#') g.fillRect(o + x * u, o + y * u, u, u);
    return c;
  }

  const textCache = new Map();
  function textSprite(str, u, fill) {
    const key = str + '|' + u + '|' + fill;
    let s = textCache.get(key);
    if (s) return s;
    const items = [];
    for (const ch of str.normalize('NFD')) {
      if (ch >= '̀' && ch <= 'ͯ') { if (items.length) items[items.length - 1].m.push(ch); }
      else items.push({ ch, m: [] });
    }
    const hasTop = items.some(it => it.m.some(m => MARKS_TOP[m]));
    const hasBot = items.some(it => it.m.includes('̧'));
    const top = hasTop ? 3 : 0;
    const gw = Math.max(1, items.length * 6 - 1), gh = top + 7 + (hasBot ? 2 : 0);
    const rows = Array.from({ length: gh }, () => Array(gw).fill('0'));
    items.forEach((it, i) => {
      const x0 = i * 6;
      (FONT[it.ch] || FONT[' ']).forEach((row, r) => {
        for (let x = 0; x < 5; x++) if (row[x] === '1') rows[top + r][x0 + x] = '1';
      });
      for (const m of it.m) {
        if (MARKS_TOP[m]) for (const [px, py] of MARKS_TOP[m]) rows[py][x0 + px] = '1';
        if (m === '̧') rows[top + 7][x0 + 2] = '1';
      }
    });
    s = gridSprite(rows.map(r => r.join('')), u, fill);
    textCache.set(key, s);
    return s;
  }

  function drawText(str, x, y, u, fill = '#ffffff', align = 'center') {
    const s = textSprite(str, u, fill);
    const dx = align === 'center' ? x - s.width / 2 : align === 'right' ? x - s.width : x;
    ctx.drawImage(s, Math.round(dx), Math.round(y - s.height / 2));
  }

  // ================= Sprites do pássaro (17x12, desenhado a 2x = 34x24) =================
  const BIRD_BODY = [
    '......kkkkkkk....',
    '....kkyyyykwwk...',
    '...klyyyykwwwwk..',
    '..kyyyyyykwwwkwk.',
    '.kyyyyyyykwwwkwk.',
    '.kyyyyyyyykwwwwk.',
    'kyyyyyyyyyykkkkkk',
    'kyyyyyyyyykrrrrrk',
    '.kolllllokkkkkkk.',
    '.koollllkrrrrrk..',
    '..kooooookkkkkk..',
    '...kkkkkk........'
  ];
  // asa em 3 posições: [linha, trecho a partir da coluna 0] ('.' mantém o corpo)
  const WINGS = [
    [[3, '.kkkk.'], [4, 'kwwwwk'], [5, 'kwwwk.'], [6, 'kkkk..']],
    [[5, 'kkkkk.'], [6, 'kwwwwk'], [7, 'kwwwlk'], [8, '.kkkk.']],
    [[6, 'kkkkk.'], [7, 'kwwwwk'], [8, 'kwwwlk'], [9, '.kwwk.'], [10, '..kk..']]
  ];
  const BIRD_COLORS = [
    { y: '#f9d13b', o: '#f29e2c', l: '#fbe6a2', r: '#f0602c' },   // amarelo
    { y: '#4fb3e8', o: '#2a7fc0', l: '#bfe6fb', r: '#f37a2a' },   // azul
    { y: '#e8553e', o: '#b8322a', l: '#f6b39c', r: '#f8b02c' }    // vermelho
  ];
  function buildBird(colors, frame) {
    const rows = BIRD_BODY.map(r => r.split(''));
    for (const [ry, str] of WINGS[frame]) for (let i = 0; i < str.length; i++) if (str[i] !== '.') rows[ry][i] = str[i];
    return paletteSprite(rows.map(r => r.join('')), { k: K, w: '#ffffff', ...colors });
  }
  const birdSets = BIRD_COLORS.map(c => [0, 1, 2].map(f => buildBird(c, f)));
  const WING_SEQ = [0, 1, 2, 1];

  // Mãozinha "toque aqui" da tela inicial
  const HAND = paletteSprite([
    '...kk......',
    '..kwwk.....',
    '..kwwk.....',
    '..kwwkkk...',
    '..kwwkwwkk.',
    'kkkwwkwwkwk',
    'kwkwwwwwwwk',
    'kwwwwwwwwwk',
    'kwwwwwwwwwk',
    '.kwwwwwwwk.',
    '..kwwwwwk..',
    '..kkkkkkk..'
  ], { k: K, w: '#ffffff' });

  // ================= Cenário: dia e noite (camadas em meia resolução) =================
  const SCENES = {
    day: {
      sky: '#4ec0ca', cloud: '#d4f2c8', cloudHi: '#eefcdf',
      cityEdge: '#78c8c8', cityFill: '#b0e4de', win: '#8fd4d2', winRate: 0.7,
      bushDark: '#3fae4e', bushLight: '#6edc5f', stars: false
    },
    night: {
      sky: '#0e5b73', cloud: '#1d7389', cloudHi: '#2a8aa0',
      cityEdge: '#0a3f50', cityFill: '#145f73', win: '#f2d96b', winRate: 0.35,
      bushDark: '#1d6e36', bushLight: '#2c9447', stars: true
    }
  };
  function buildClouds(p) {
    const c = mk(144, 32), g = c.getContext('2d'), r = rng(7);
    const blobs = [];
    for (let x = 0; x < 144; x += 12 + Math.floor(r() * 8))
      blobs.push([x, 20 - Math.floor(r() * 9), 6 + Math.floor(r() * 5)]);
    for (const [bx, by, br] of blobs) for (const o of [-144, 0, 144]) disc(g, bx + o, by, br, p.cloud);
    g.fillStyle = p.cloud; g.fillRect(0, 22, 144, 10);
    for (const [bx, by, br] of blobs) for (const o of [-144, 0, 144]) disc(g, bx + o, by - 1, br - 1, p.cloudHi);
    g.fillStyle = p.cloudHi; g.fillRect(0, 24, 144, 8);
    return c;
  }
  function buildCity(p) {
    const c = mk(144, 40), g = c.getContext('2d'), r = rng(21);
    let x = 0;
    while (x < 144) {
      let w = 8 + Math.floor(r() * 9);
      if (144 - x < w + 6) w = 144 - x;
      const h = 12 + Math.floor(r() * 22), top = 40 - h;
      g.fillStyle = p.cityEdge; g.fillRect(x, top, w, h);
      g.fillStyle = p.cityFill; g.fillRect(x + 1, top + 1, w - 2, h - 1);
      g.fillStyle = p.win;
      for (let wy = top + 3; wy < 38; wy += 3)
        for (let wx = x + 2; wx < x + w - 2; wx += 3) if (r() < p.winRate) g.fillRect(wx, wy, 1, 1);
      if (r() < 0.3 && w > 4) { g.fillStyle = p.cityEdge; g.fillRect(x + Math.floor(w / 2), top - 3, 1, 3); }
      x += w;
    }
    return c;
  }
  function buildBush(p) {
    const c = mk(144, 12), g = c.getContext('2d'), r = rng(99);
    const blobs = [];
    for (let x = 0; x < 144; x += 8 + Math.floor(r() * 6)) blobs.push([x, 8 + Math.floor(r() * 2), 4 + Math.floor(r() * 3)]);
    for (const [bx, by, br] of blobs) for (const o of [-144, 0, 144]) disc(g, bx + o, by, br, p.bushDark);
    g.fillStyle = p.bushDark; g.fillRect(0, 9, 144, 3);
    for (const [bx, by, br] of blobs) for (const o of [-144, 0, 144]) disc(g, bx + o, by - 1, br - 1, p.bushLight);
    return c;
  }
  for (const key in SCENES) {
    const p = SCENES[key];
    p.layers = { clouds: buildClouds(p), city: buildCity(p), bush: buildBush(p) };
    const r = rng(5);
    p.starList = Array.from({ length: 40 }, () => [Math.floor(r() * W), Math.floor(r() * 300), Math.floor(r() * 60)]);
  }

  function buildGround() {
    const w = W + 24, c = mk(w, GROUND_H), g = c.getContext('2d');
    g.fillStyle = '#ded895'; g.fillRect(0, 0, w, GROUND_H);
    g.fillStyle = K; g.fillRect(0, 0, w, 2);
    for (let y = 2; y < 14; y += 2) for (let x = 0; x < w; x += 2) {
      g.fillStyle = ((x / 2 + y / 2) % 12 < 6) ? '#a2ea5c' : PIPE.mid;
      g.fillRect(x, y, 2, 2);
    }
    g.fillStyle = '#5b8c26'; g.fillRect(0, 14, w, 2);
    g.fillStyle = '#f4eeb4'; g.fillRect(0, 16, w, 2);
    g.fillStyle = '#cdbb64';
    for (let x = 0; x < w; x += 24) { g.fillRect(x + 2, 40, 6, 2); g.fillRect(x + 14, 66, 6, 2); g.fillRect(x + 6, 92, 6, 2); }
    return c;
  }
  const groundImg = buildGround();

  // ================= Medalhas e ícones =================
  function buildMedal(base, ring, empty) {
    const c = mk(29, 29), g = c.getContext('2d');
    if (empty) { disc(g, 14, 14, 13, '#c9b97d'); disc(g, 14, 14, 10, '#d8c98f'); return c; }
    disc(g, 14, 14, 14, K);
    disc(g, 14, 14, 12, base);
    disc(g, 14, 14, 9, ring);
    disc(g, 14, 14, 7, base);
    g.fillStyle = ring; g.fillRect(13, 9, 3, 11); g.fillRect(9, 13, 11, 3);
    return c;
  }
  const MEDALS = [
    [40, buildMedal('#9ad6ea', '#e8f8ff')],   // platina
    [30, buildMedal('#f2bd2c', '#fff0a0')],   // ouro
    [20, buildMedal('#c8cdd0', '#ffffff')],   // prata
    [10, buildMedal('#c97a3b', '#efb27a')]    // bronze
  ];
  const medalNone = buildMedal(null, null, true);

  const SPK_ON = ['....#......', '...##..#...', '#####...#..', '#####.#..#.', '#####.#..#.', '#####...#..', '...##..#...', '....#......'];
  const SPK_OFF = ['....#......', '...##.#...#', '#####..#.#.', '#####...#..', '#####..#.#.', '#####.#...#', '...##......', '....#......'];
  const spkOn = gridSprite(SPK_ON, 2, '#ffffff'), spkOff = gridSprite(SPK_OFF, 2, '#ffffff');

  // ================= Estado =================
  let state, bird, pipes, score, dispScore, groundX, bgX, t, flash, deadFrames, overT, medalT, landed, newBest, paused, readyY;
  let scene, birdSprites, fadeT = -1;
  let best = parseInt(store.get('flappy-pwa-best', '0'), 10) || 0;
  let muted = store.get('flappy-pwa-muted', '0') === '1';
  t = 0;

  function fitH() {
    const r = window.innerHeight / window.innerWidth;
    H = Math.max(512, Math.min(640, Math.round(W * r)));
    GROUND_Y = H - GROUND_H;
    readyY = Math.round(GROUND_Y * 0.5);
  }

  function reset() {
    fitH();
    layout();
    state = 'ready';
    scene = Math.random() < 0.5 ? SCENES.day : SCENES.night;
    birdSprites = birdSets[Math.floor(Math.random() * birdSets.length)];
    bird = { x: BIRD_X, y: readyY, vy: 0, rot: 0, crashFloor: false };
    pipes = [];
    score = 0; dispScore = 0;
    groundX = 0; bgX = 0;
    flash = 0;
    deadFrames = 0; overT = 0; medalT = 0;
    landed = false; newBest = false; paused = false;
  }

  // ================= Áudio (WebAudio sintetizado, sem arquivos) =================
  let actx = null, master = null, noiseBuf = null, unlocked = false;
  function unlockAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain();
        master.gain.value = 0.7;
        master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch { actx = null; return; }
    }
    if (actx.state !== 'running') actx.resume().catch(() => {});
    if (!unlocked) {   // iOS: toca um buffer vazio dentro do gesto do usuário
      try {
        const s = actx.createBufferSource();
        s.buffer = actx.createBuffer(1, 1, 22050);
        s.connect(actx.destination);
        s.start(0);
        unlocked = true;
      } catch { /* ignora */ }
    }
  }
  function osc(type, f0, f1, t0, dur, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }
  function noise(kind, f0, f1, t0, dur, vol) {
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf;
    f.type = kind;
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(master);
    s.start(t0);
    s.stop(t0 + dur + 0.03);
  }
  const play = (fn) => { if (muted || !actx || actx.state !== 'running') return; try { fn(actx.currentTime); } catch { /* ignora */ } };
  const sfx = {
    flap:   () => play(t0 => { osc('triangle', 300, 600, t0, 0.09, 0.22); noise('highpass', 2500, 5000, t0, 0.05, 0.08); }),
    score:  () => play(t0 => { osc('square', 988, 988, t0, 0.07, 0.10); osc('square', 1319, 1319, t0 + 0.07, 0.28, 0.10); }),
    hit:    () => play(t0 => { noise('lowpass', 2200, 200, t0, 0.2, 0.7); osc('square', 160, 45, t0, 0.16, 0.25); }),
    die:    () => play(t0 => { osc('triangle', 520, 90, t0, 0.38, 0.3); }),
    swoosh: () => play(t0 => { noise('bandpass', 400, 2400, t0, 0.22, 0.35); }),
    medal:  () => play(t0 => { osc('square', 1319, 1319, t0, 0.06, 0.07); osc('square', 1760, 1760, t0 + 0.06, 0.06, 0.07); osc('square', 2093, 2093, t0 + 0.12, 0.2, 0.07); })
  };

  // ================= Lógica =================
  // Abertura sorteada numa faixa central (como no FlapPyBird) e com salto limitado
  // entre canos vizinhos, para não ficar impossível em telas altas.
  function spawnPipe(x) {
    const range = Math.min(GROUND_Y * 0.6 - GAP, 180);
    const min = Math.round(GROUND_Y * 0.5 - (range + GAP) / 2);
    let gapY = min + Math.random() * range;
    const prev = pipes[pipes.length - 1];
    if (prev) gapY = Math.max(prev.gapY - 150, Math.min(prev.gapY + 150, gapY));
    pipes.push({ x, gapY: Math.round(gapY), scored: false });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function pipeHit(p) {
    const bot = p.gapY + GAP;
    return circleRect(bird.x, bird.y, BIRD_R, p.x + 2, -1000, BODY_W, 1000 + p.gapY - CAP_H) ||
           circleRect(bird.x, bird.y, BIRD_R, p.x, p.gapY - CAP_H, PIPE_W, CAP_H) ||
           circleRect(bird.x, bird.y, BIRD_R, p.x, bot, PIPE_W, CAP_H) ||
           circleRect(bird.x, bird.y, BIRD_R, p.x + 2, bot + CAP_H, BODY_W, GROUND_Y);
  }

  function die(onGround) {
    if (state === 'dead') return;
    state = 'dead';
    flash = 1;
    deadFrames = 0; overT = 0; medalT = 0;
    if (score > best) { best = score; newBest = true; store.set('flappy-pwa-best', String(best)); }
    sfx.hit();
    bird.crashFloor = onGround;
    if (onGround) { landed = true; bird.y = GROUND_Y - BIRD_R; }
    else bird.vy = 3.5;
  }

  // Botão "JOGAR" do placar (reiniciar só pelo botão evita recomeçar sem querer)
  const BTN = { w: 112, h: 40 };
  function btnRect() {
    const py = panelTop();
    return { x: Math.round((W - BTN.w) / 2), y: py + 116 + 22, w: BTN.w, h: BTN.h };
  }
  const panelTop = () => Math.round(GROUND_Y * 0.36);
  const canRestart = () => state === 'dead' && landed && overT > 50;

  function restart() {
    if (fadeT >= 0) return;
    fadeT = 0;
    sfx.swoosh();
  }

  function flap() {
    unlockAudio();
    if (fadeT >= 0) return;
    if (paused) { paused = false; return; }
    if (state === 'ready') {
      state = 'playing';
      spawnPipe(W + 40);
    }
    if (state === 'playing') {
      bird.vy = FLAP;
      sfx.flap();
    }
  }

  function step() {
    t++;
    if (flash > 0) flash = Math.max(0, flash - 0.07);
    if (fadeT >= 0) {
      fadeT++;
      if (fadeT === 12) reset();
      if (fadeT >= 24) fadeT = -1;
    }

    if (state === 'ready') {
      bird.y = readyY + Math.sin(t * 0.12) * 4;
      groundX += SPEED; bgX += SPEED;
      return;
    }

    if (state === 'playing') {
      groundX += SPEED; bgX += SPEED;
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      // sobe inclinado ~20 graus; depois do topo do pulo mergulha até 90 graus
      bird.rot = bird.vy < 0 ? -0.35 : Math.min(bird.rot + 0.06, 1.57);
      if (bird.y < -40) { bird.y = -40; if (bird.vy < 0) bird.vy = 0; }   // pode sair um pouco pelo topo, como no original

      for (const p of pipes) p.x -= SPEED;
      if (pipes.length && pipes[0].x + PIPE_W < -4) pipes.shift();
      while (pipes[pipes.length - 1].x + SPACING <= W + 10) spawnPipe(pipes[pipes.length - 1].x + SPACING);

      for (const p of pipes) {
        if (!p.scored && p.x + PIPE_W / 2 < bird.x) { p.scored = true; score++; sfx.score(); }
        if (pipeHit(p)) { die(false); return; }
      }
      if (bird.y + BIRD_R >= GROUND_Y) die(true);
      return;
    }

    // state === 'dead'
    deadFrames++;
    if (deadFrames === 8) sfx.die();
    if (!landed) {
      bird.vy = Math.min(bird.vy + CRASH_GRAVITY, CRASH_MAX);
      bird.y += bird.vy;
      bird.rot = Math.min(bird.rot + 0.14, 1.57);
      if (bird.y + BIRD_R >= GROUND_Y) { bird.y = GROUND_Y - BIRD_R; landed = true; overT = 0; }
    } else {
      overT++;
      if (overT === 14) sfx.swoosh();
      if (overT > 34 && overT % 2 === 0 && dispScore < score) dispScore = Math.min(score, dispScore + Math.ceil(score / 40));
      if (overT > 34 && dispScore === score && MEDALS.some(([min]) => score >= min)) {
        if (medalT === 0) sfx.medal();
        medalT++;
      }
    }
  }

  // ================= Desenho =================
  function drawLayer(img, bottom, off) {
    const w = img.width * 2, h = img.height * 2;
    const x = -Math.floor(((off % w) + w) % w);
    ctx.drawImage(img, 0, 0, img.width, img.height, x, bottom - h, w, h);
    ctx.drawImage(img, 0, 0, img.width, img.height, x + w, bottom - h, w, h);
  }

  function drawBackground() {
    ctx.fillStyle = scene.sky;
    ctx.fillRect(0, 0, W, H);
    if (scene.stars) {
      for (const [sx, sy, ph] of scene.starList) {
        if (sy > GROUND_Y - 150) continue;
        ctx.fillStyle = ((t + ph * 3) % 120) < 100 ? '#ffffff' : '#7fb8c8';
        ctx.fillRect(sx, sy, 2, 2);
      }
    }
    drawLayer(scene.layers.clouds, GROUND_Y - 30, bgX * 0.1);
    drawLayer(scene.layers.city, GROUND_Y - 4, bgX * 0.25);
    drawLayer(scene.layers.bush, GROUND_Y, bgX * 0.5);
  }

  const BANDS = [0, 0.06, 0.2, 0.3, 0.72, 1];
  const BAND_COL = [PIPE.light, PIPE.hi, PIPE.light, PIPE.mid, PIPE.dark];
  function bands(x, y, w, h) {
    for (let i = 0; i < BAND_COL.length; i++) {
      const x0 = Math.round(w * BANDS[i]), x1 = Math.round(w * BANDS[i + 1]);
      ctx.fillStyle = BAND_COL[i];
      ctx.fillRect(x + x0, y, x1 - x0, h);
    }
  }
  function pipeBody(x, y, h) {
    ctx.fillStyle = K;
    ctx.fillRect(x + 2, y, BODY_W, h);
    bands(x + 4, y, BODY_W - 4, h);
  }
  function pipeCap(x, y) {
    ctx.fillStyle = K;
    ctx.fillRect(x, y, PIPE_W, CAP_H);
    bands(x + 2, y + 2, PIPE_W - 4, CAP_H - 4);
    ctx.fillStyle = PIPE.dark;   // sombra sob a borda da boca
    ctx.fillRect(x + 2, y + CAP_H - 4, PIPE_W - 4, 2);
  }
  function drawPipes() {
    for (const p of pipes) {
      const x = Math.round(p.x), top = p.gapY, bot = p.gapY + GAP;
      pipeBody(x, -4, top - CAP_H + 4);
      pipeCap(x, top - CAP_H);
      pipeBody(x, bot + CAP_H, GROUND_Y - bot - CAP_H + 4);
      pipeCap(x, bot);
    }
  }

  function drawGround() {
    ctx.drawImage(groundImg, -(groundX % 24), GROUND_Y);
  }

  function drawBird() {
    // asas param no mergulho e após a batida, como no original
    const diving = state === 'playing' && bird.rot > 1.2;
    const f = state === 'dead' || diving ? 1 : WING_SEQ[Math.floor(t / 6) % 4];
    ctx.save();
    ctx.translate(Math.round(bird.x), Math.round(bird.y));
    ctx.rotate(bird.rot);
    ctx.drawImage(birdSprites[f], -17, -12, 34, 24);
    ctx.restore();
  }

  function box(x, y, w, h, fill, hi) {
    ctx.fillStyle = K;
    ctx.fillRect(x + 2, y, w - 4, h);
    ctx.fillRect(x, y + 2, w, h - 4);
    ctx.fillStyle = fill;
    ctx.fillRect(x + 4, y + 2, w - 8, h - 4);
    ctx.fillRect(x + 2, y + 4, w - 4, h - 8);
    if (hi) { ctx.fillStyle = hi; ctx.fillRect(x + 4, y + 4, w - 8, 2); }
  }

  const easeOut = (e) => 1 - (1 - e) * (1 - e);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function drawGameOver() {
    const pw = 226, ph = 116, px = Math.round((W - pw) / 2), py = panelTop();

    // título desce e aparece
    const te = easeOut(clamp01(overT / 12));
    ctx.save();
    ctx.globalAlpha = te;
    drawText('FIM DE JOGO', W / 2, py - 44 - Math.round((1 - te) * 16), 3, '#fb9a2e');
    ctx.restore();

    // placar sobe desde a base da tela
    const pe = easeOut(clamp01((overT - 12) / 20));
    if (pe <= 0) return;
    const oy = Math.round((1 - pe) * (H - py));
    ctx.save();
    ctx.translate(0, oy);
    box(px, py, pw, ph, '#ded895', '#f4eeb4');

    const lc = '#e86a28';
    drawText('MEDALHA', px + 62, py + 20, 2, lc);
    const m = MEDALS.find(([min]) => score >= min);
    if (m && medalT > 0) {
      const s = 1 + Math.max(0, 1 - medalT / 12);          // escala 2 -> 1
      const size = Math.round(29 * s);
      ctx.save();
      ctx.globalAlpha = clamp01(medalT / 12);
      ctx.drawImage(m[1], px + 62 - Math.round(size / 2), py + 66 - Math.round(size / 2), size, size);
      ctx.restore();
      if (medalT > 12) {                                   // brilho piscando
        const k = Math.floor(t / 10);
        const sx = px + 62 - 10 + ((k * 7) % 20), sy = py + 66 - 10 + ((k * 13) % 20);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx, sy - 2, 2, 6);
        ctx.fillRect(sx - 2, sy, 6, 2);
      }
    } else {
      ctx.drawImage(medalNone, px + 62 - 14, py + 66 - 14);
    }
    if (newBest && dispScore === score) drawText('NOVO!', px + 62, py + 100, 2, '#ee3c2c');

    drawText('PONTOS', px + 164, py + 20, 2, lc);
    drawText(String(dispScore), px + 164, py + 44, 3);
    drawText('RECORDE', px + 164, py + 72, 2, lc);
    drawText(String(best), px + 164, py + 96, 3);

    if (canRestart()) {
      const b = btnRect();
      box(b.x, b.y, b.w, b.h, '#fb9a2e', '#ffc46b');
      ctx.fillStyle = '#d8701c';
      ctx.fillRect(b.x + 4, b.y + b.h - 6, b.w - 8, 2);
      drawText('JOGAR', b.x + b.w / 2, b.y + b.h / 2 - 1, 3);
    }
    ctx.restore();
  }

  function drawHud() {
    const spk = muted ? spkOff : spkOn;
    ctx.drawImage(spk, W - spk.width - 8, Math.round(safeTop) + 8);

    if (state === 'playing' || (state === 'dead' && !landed))
      drawText(String(score), W / 2, Math.round(safeTop) + 62, 4);

    if (state === 'ready') {
      drawText('FLAPPY BIRD', W / 2, Math.round(GROUND_Y * 0.18) + Math.round(safeTop / 2), 4, '#ffd23a');
      drawText('PREPARE-SE!', W / 2, Math.round(GROUND_Y * 0.3), 3, '#fb8d2e');
      // mãozinha tocando, ao lado do pássaro
      const hy = readyY + 4 + (Math.floor(t / 20) % 2) * 4;
      ctx.drawImage(HAND, W / 2 + 4, hy, 22, 24);
      ctx.fillStyle = '#ffffff';
      if (Math.floor(t / 20) % 2 === 0) {
        ctx.fillRect(W / 2 - 2, hy - 6, 4, 2); ctx.fillRect(W / 2 + 26, hy - 6, 4, 2);
        ctx.fillRect(W / 2 + 12, hy - 12, 2, 4);
      }
      const y = readyY + 64;
      if (isTouch) {
        drawText('TOQUE NA TELA', W / 2, y, 2);
        drawText('PARA VOAR', W / 2, y + 24, 2);
      } else {
        drawText('CLIQUE OU TECLE', W / 2, y, 2);
        drawText('ESPAÇO PARA VOAR', W / 2, y + 24, 2);
        drawText('M = SOM   P = PAUSA', W / 2, GROUND_Y + 56, 2);
      }
    }

    if (state === 'dead' && landed) drawGameOver();

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0, 0, W, H);
      drawText('PAUSADO', W / 2, H / 2 - 12, 4);
      drawText(isTouch ? 'TOQUE PARA CONTINUAR' : 'CLIQUE PARA CONTINUAR', W / 2, H / 2 + 28, 2);
    }
  }

  function render() {
    // tremida curta na batida
    const shake = state === 'dead' && deadFrames < 8;
    ctx.save();
    if (shake) ctx.translate(Math.round((Math.random() * 2 - 1) * 3), Math.round((Math.random() * 2 - 1) * 3));
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();
    ctx.restore();
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.85})`;
      ctx.fillRect(0, 0, W, H);
    }
    drawHud();
    if (fadeT >= 0) {   // transição escura ao reiniciar
      ctx.fillStyle = `rgba(0,0,0,${1 - Math.abs(fadeT - 12) / 12})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ================= Loop com passo fixo de 60 Hz =================
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;
    if (!paused) {
      acc += dt;
      while (acc >= STEP) { step(); acc -= STEP; }
    }
    render();
    requestAnimationFrame(frame);
  }

  // ================= Tamanho, nitidez e área segura do iPhone =================
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const cw = Math.min(vw, vh * W / H), ch = cw * H / W;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    const S = Math.max(1, Math.round(cw / W * (window.devicePixelRatio || 1)));   // escala inteira = pixels nítidos
    if (canvas.width !== W * S || canvas.height !== H * S) { canvas.width = W * S; canvas.height = H * S; }
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const sp = document.getElementById('safe').offsetHeight;
    const gap = Math.max(0, (vh - ch) / 2);
    safeTop = Math.max(0, sp - gap) * W / cw;
  }
  function onResize() {
    if (state === 'ready') { fitH(); bird.y = readyY; }
    layout();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

  // ================= Controles =================
  function toggleMute() {
    muted = !muted;
    store.set('flappy-pwa-muted', muted ? '1' : '0');
  }
  function togglePause() {
    if (state === 'playing') { paused = !paused; last = performance.now(); }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * W / r.width;
    const y = (e.clientY - r.top) * H / r.height;
    if (x > W - 44 && y < safeTop + 40) { unlockAudio(); toggleMute(); return; }
    if (state === 'dead') {
      unlockAudio();
      const b = btnRect();
      if (canRestart() && x >= b.x - 8 && x <= b.x + b.w + 8 && y >= b.y - 8 && y <= b.y + b.h + 8) restart();
      return;
    }
    flap();
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'dead') { if (canRestart()) restart(); }
      else flap();
    }
    else if (e.code === 'KeyM') toggleMute();
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });

  // iOS só libera o áudio em alguns tipos de gesto: tenta em todos
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') paused = true;
    last = performance.now();
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  // ================= Início =================
  reset();
  requestAnimationFrame(frame);

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
